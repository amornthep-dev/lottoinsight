name: 🎱 Auto Update Lottery Data

on:
  # Thai lottery: วันที่ 1 และ 16 เวลา 15:30 น. ไทย (08:30 UTC)
  # Lao lottery:  จันทร์–เสาร์ เวลา 20:30 น. ไทย (13:30 UTC)
  # Hanoi lottery: ทุกวัน เวลา 18:10 น. ไทย (11:10 UTC)
  schedule:
    - cron: "30 8 1,16 * *"     # Thai
    - cron: "30 13 * * 1-6"     # Lao (Mon–Sat)
    - cron: "10 11 * * *"       # Hanoi (every day)

  # รันได้ด้วยตนเองผ่าน GitHub Actions UI
  workflow_dispatch:
    inputs:
      target:
        description: "Which lottery to fetch (thai / lao / hanoi / all)"
        required: false
        default: "all"

jobs:
  # ── Thai Lottery ────────────────────────────────────────────────────────────
  update-thai:
    name: Fetch Thai lottery result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'thai' || github.event.inputs.target == 'all'))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Thai lottery result
        run: node scripts/fetch-lottery.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/lottery.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new Thai data — skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ New Thai data found — will commit"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(node -e "
            const d = require('./data/lottery.json');
            process.stdout.write(d[0].dateDisplay);
          ")
          git add data/lottery.json
          git commit -m "data: อัปเดตผลหวยไทย ${DATE}"
          git push

      - name: Deploy to Vercel
        if: steps.changes.outputs.changed == 'true'
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Lao Lottery ─────────────────────────────────────────────────────────────
  update-lao:
    name: Fetch Lao lottery result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'lao' || github.event.inputs.target == 'all'))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Lao lottery result
        run: node scripts/fetch-lao.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/lao-lottery.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new Lao data — skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ New Lao data found — will commit"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(node -e "
            const d = require('./data/lao-lottery.json');
            process.stdout.write(d[0]?.dateDisplay ?? 'ไม่ทราบวันที่');
          ")
          git add data/lao-lottery.json
          git commit -m "data: อัปเดตผลหวยลาว ${DATE}"
          git push

      - name: Deploy to Vercel
        if: steps.changes.outputs.changed == 'true'
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Hanoi Lottery ────────────────────────────────────────────────────────────
  update-hanoi:
    name: Fetch Hanoi lottery result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'hanoi' || github.event.inputs.target == 'all'))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Hanoi lottery result
        run: node scripts/fetch-hanoi.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/hanoi-lottery.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new Hanoi data — skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ New Hanoi data found — will commit"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(node -e "
            const d = require('./data/hanoi-lottery.json');
            process.stdout.write(d[0]?.dateDisplay ?? 'ไม่ทราบวันที่');
          ")
          git add data/hanoi-lottery.json
          git commit -m "data: อัปเดตผลหวยฮานอย ${DATE}"
          git push

      - name: Deploy to Vercel
        if: steps.changes.outputs.changed == 'true'
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
